{% extends 'base.html' %}{% block content %}<div class="page-heading"><div><h2>{{ 'Editar cadastro' if user else 'Cadastrar usuário' }}</h2><p>Preencha os dados do usuário abaixo.</p></div><a href="{{ url_for('users') }}" class="btn outline">← Voltar</a></div><section class="panel form-panel"><form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><div class="form-grid"><label>Nome completo *<input name="nome" maxlength="120" minlength="2" required value="{{ request.form.get('nome', user.nome if user else '') }}" placeholder="Nome completo"></label><label>E-mail *<input type="email" name="email" maxlength="200" required value="{{ request.form.get('email', user.email if user else '') }}" placeholder="exemplo@email.com"></label><label>CPF *<input name="cpf" inputmode="numeric" required value="{{ request.form.get('cpf', user.cpf if user else '') }}" placeholder="000.000.000-00"></label><label>Telefone *<input name="telefone" inputmode="tel" required value="{{ request.form.get('telefone', user.telefone if user else '') }}" placeholder="(83) 99999-9999"></label><label>Data de nascimento *<input type="date" name="nascimento" max="{{ hoje }}" required value="{{ request.form.get('nascimento', user.nascimento if user else '') }}"></label>{% if not user %}<label>Plano de demonstração<select name="plano" required>{% for chave, p in planos.items() %}<option value="{{ chave }}" {{ 'selected' if request.form.get('plano', 'mensal') == chave else '' }}>{{ p.nome }} — R$ {{ '%.2f'|format(p.centavos / 100)|replace('.', ',') }} / {{ p.meses }} mês(es)</option>{% endfor %}</select></label><small>Preços fictícios para demonstração. O valor é definido pelo plano.</small>{% endif %}</div><div class="form-actions"><a href="{{ url_for('users') }}" class="btn outline">Cancelar</a><button class="btn primary">{{ 'Salvar alterações' if user else 'Cadastrar usuário' }}</button></div></form></section>{% endblock %}
