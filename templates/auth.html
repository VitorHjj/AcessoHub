{% extends 'base.html' %}{% block content %}<div class="auth-card"><div class="auth-logo">◈</div><h2>{{ 'Crie o administrador' if setup else 'Bem-vindo de volta' }}</h2><p>{{ 'Configure o primeiro acesso ao sistema.' if setup else 'Entre para gerenciar seus usuários.' }}</p><form method="post" class="form-stack"><input type="hidden" name="csrf" value="{{ csrf }}"><label>Usuário<input name="usuario" minlength="3" required autocomplete="username" placeholder="Seu usuário"></label><label>Senha<input name="senha" type="password" minlength="{{ 10 if setup else 1 }}" required autocomplete="{{ 'new-password' if setup else 'current-password' }}" placeholder="{{ 'Mínimo de 10 caracteres' if setup else 'Sua senha' }}"></label><button class="btn primary wide">{{ 'Criar administrador' if setup else 'Entrar no sistema' }}</button></form></div>{% endblock %}
